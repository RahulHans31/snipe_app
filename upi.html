<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:"><title>UPI QR</title><style>body{margin:0;background:#0a0a0b;color:#e5e7eb;font:14px "Segoe UI",sans-serif;padding:22px}h1{font:14px ui-monospace,Consolas,monospace;letter-spacing:2px;color:#f59e0b}#card{background:#fff;color:#111;padding:16px;text-align:center;margin-top:18px}#card.paid{background:#052e1a;color:#43d17a}#card.failed{background:#2a0a0a;color:#ff6b6b}#qr{width:280px;max-width:100%;image-rendering:pixelated}#sub{color:#6b7280;margin-top:10px}#card.paid #sub,#card.failed #sub{color:inherit}button{width:100%;margin-top:18px;padding:12px;background:#f59e0b;color:#0a0a0b;border:0;font:12px ui-monospace,Consolas,monospace;cursor:pointer}.note{color:#737987;font-size:12px;line-height:1.5}</style></head><body><h1>UPI PAYMENT · QR READY</h1><div class="note" id="account"></div><div id="card"><img id="qr" alt="UPI QR"><div id="sub">Waiting for payment…</div></div><button id="intent" hidden>OPEN UPI APP</button><script>window.renderUpi=(d)=>{document.getElementById('account').textContent=d.accountName||'Account';const qr=d.qrCode||'';document.getElementById('qr').src=qr.startsWith('data:')?qr:`data:image/png;base64,${qr}`;document.getElementById('sub').textContent=d.pollingText||'Scan to pay';const b=document.getElementById('intent');if(d.upiIntent){b.hidden=false;b.onclick=()=>location.href=d.upiIntent;}};window.snipeUpiUpdate=(p)=>{const card=document.getElementById('card');const sub=document.getElementById('sub');if(p.kind==='success'){card.className='paid';sub.textContent=p.orderRef?`Paid · Order ${p.orderRef}`:'Paid · order confirmed';document.getElementById('qr').style.display='none';}else if(p.kind==='failed'){card.className='failed';sub.textContent=`Failed · ${p.reason||'payment did not complete'}`;}else if(p.kind==='pending'){sub.textContent=p.text||'Waiting for payment…';}};</script></body></html>
